<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F5F5F5;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F5F5F5;
        }
        .amap-logo, .amap-copyright {
            display: none !important;
        }

        /* Clean Classic AutoNavi Location Dot (No Triangle, No Large Accuracy Circle) */
        .amap-user-dot-clean {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1E88E5;
            border: 3px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="container"></div>

<script>
    var map = null;
    var defaultLayer = null;
    var buildingsLayer = null;
    var satelliteLayer = null;
    var roadNetLayer = null;
    var startMarker = null;
    var longPressTimer = null;
    var touchStartX = 0, touchStartY = 0;
    var autoSuggest = null;
    var geolocation = null;
    var currentLat = 29.50862, currentLng = 106.49776;

    var userLocationHtml = '<div class="amap-user-dot-clean"></div>';

    window.onload = function() {
        var key = '8325164e247e15eea68b59e89200988b';
        var secret = '';
        if (window.Android) {
            try {
                var config = window.Android.getAMapConfig();
                if (config) {
                    var parts = config.split('|');
                    if (parts[0] && parts[0].trim().length > 0) key = parts[0].trim();
                    if (parts[1] && parts[1].trim().length > 0) secret = parts[1].trim();
                }
            } catch(e) {}
        }
        startLoadAMap(key, secret);
    };

    function startLoadAMap(key, secret) {
        if (secret) {
            window._AMapSecurityConfig = { securityJsCode: secret };
        }
        var script = document.createElement('script');
        script.src = "https://webapi.amap.com/maps?v=2.0&key=" + key + "&plugin=AMap.AutoComplete,AMap.Geolocation";
        script.onload = function() {
            if (typeof AMap !== 'undefined' && AMap.Map) {
                defaultLayer = AMap.createDefaultLayer();
                buildingsLayer = new AMap.Buildings();
                satelliteLayer = new AMap.TileLayer.Satellite();
                roadNetLayer = new AMap.TileLayer.RoadNet();

                map = new AMap.Map('container', {
                    zoom: 16,
                    center: [currentLng, currentLat],
                    layers: [defaultLayer, buildingsLayer],
                    resizeEnable: true,
                    rotateEnable: true,
                    pitchEnable: true,
                    viewMode: '3D'
                });

                autoSuggest = new AMap.AutoComplete({ city: '全国' });
                try {
                    geolocation = new AMap.Geolocation({
                        enableHighAccuracy: true,
                        timeout: 10000,
                        showCircle: false,   /* Hide large blue accuracy circle completely */
                        showMarker: false,   /* Hide Geolocation extra native marker */
                        panToLocation: true
                    });
                } catch(e) {}

                map.on('complete', function() {
                    if (window.Android) window.Android.onMapReady();
                });

                var container = document.getElementById('container');
                container.addEventListener('touchstart', onTouchStart, {passive: false});
                container.addEventListener('touchmove', onTouchMove, {passive: false});
                container.addEventListener('touchend', onTouchEnd, {passive: false});
            }
        };
        document.head.appendChild(script);
    }

    function jsZoomIn() {
        if (map) map.zoomIn();
    }

    function jsZoomOut() {
        if (map) map.zoomOut();
    }

    function jsLocateUser() {
        if (geolocation) {
            geolocation.getCurrentPosition(function(status, result) {
                if (status === 'complete' && result && result.position) {
                    var lat = result.position.lat;
                    var lng = result.position.lng;
                    jsSetStart(lat, lng, '真实位置');
                    if (window.Android) window.Android.onPointSelected(lat, lng, '真实位置');
                }
            });
        }
    }

    function jsFetchTips(keyword) {
        if (autoSuggest) {
            autoSuggest.search(keyword, function(status, result) {
                if (status === 'complete' && result.tips) {
                    var res = [];
                    for (var i = 0; i < result.tips.length; i++) {
                        var t = result.tips[i];
                        if (t.location) {
                            res.push(t.name + "," + t.district + "," + t.location.lat + "," + t.location.lng);
                        }
                    }
                    if (window.Android) window.Android.onReceiveTips(res.join("|"));
                }
            });
        }
    }

    function onTouchStart(e) {
        var touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(function() {
            if (map) {
                var lnglat = map.containerToLngLat(new AMap.Pixel(touchStartX, touchStartY));
                if (window.Android) window.Android.onPointSelected(lnglat.getLat(), lnglat.getLng(), "地图选点");
                jsSetStart(lnglat.getLat(), lnglat.getLng(), "选点");
            }
        }, 500);
    }

    function onTouchMove(e) {
        var touch = e.touches[0];
        if (Math.abs(touch.clientX - touchStartX) > 10 || Math.abs(touch.clientY - touchStartY) > 10) {
            clearTimeout(longPressTimer);
        }
    }

    function onTouchEnd(e) {
        clearTimeout(longPressTimer);
    }

    function jsSetStart(lat, lng, name) {
        currentLat = lat;
        currentLng = lng;
        if (map) {
            if (startMarker) map.remove(startMarker);
            startMarker = new AMap.Marker({
                position: [lng, lat],
                content: userLocationHtml,
                offset: new AMap.Pixel(-9, -9)
            });
            map.add(startMarker);
            map.panTo([lng, lat]);
        }
    }

    function jsSetEnd(lat, lng) {}

    function jsClearRoute() {
        if (map && startMarker) {
            map.remove(startMarker);
        }
    }

    function jsSetMapStyle(styleType) {
        if (map && typeof AMap !== 'undefined') {
            try {
                if (!defaultLayer) defaultLayer = AMap.createDefaultLayer();
                if (!buildingsLayer) buildingsLayer = new AMap.Buildings();
                if (!satelliteLayer) satelliteLayer = new AMap.TileLayer.Satellite();
                if (!roadNetLayer) roadNetLayer = new AMap.TileLayer.RoadNet();

                if (styleType === 'amap_sat') {
                    buildingsLayer.hide();
                    satelliteLayer.show();
                    roadNetLayer.show();
                    map.setLayers([satelliteLayer, roadNetLayer]);
                } else {
                    satelliteLayer.hide();
                    roadNetLayer.hide();
                    buildingsLayer.show();
                    map.setLayers([defaultLayer, buildingsLayer]);
                    map.setMapStyle('amap://styles/normal');
                }
            } catch(e) {}
        }
    }
</script>
</body>
</html>
